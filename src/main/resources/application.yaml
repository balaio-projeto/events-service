server:
  port: ${EVENTS_SERVICE_PORT:8085}
spring:
  application:
    name: events-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://events-db:5432/balaio_events}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
balaio:
  jwt:
    # Somente chave PÚBLICA. O events-service nunca emite token nem recebe chave privada.
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
    issuer: ${JWT_ISSUER:}
    audience: ${JWT_AUDIENCE:}
  profile-url: ${PROFILE_SERVICE_URL:http://localhost:8082}
  internal-token: ${BALAIO_INTERNAL_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
